<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Regerd AI - Created by Aditya Ghatak</title>
  <style>
    /* Global Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      color: #0f172a;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-viewport {
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Desktop Sidebar */
    .sidebar {
      width: 280px;
      background-color: #f8fafc;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      z-index: 20;
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }

    .new-chat-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      transition: background 0.2s;
    }

    .new-chat-btn:hover {
      background: #f1f5f9;
    }

    .history-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      padding-left: 6px;
    }

    .chat-history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      color: #0f172a;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:hover, .history-item.active {
      background-color: #e2e8f0;
    }

    /* Main Workspace */
    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100%;
      min-width: 0;
      background: #ffffff;
    }

    .app-header {
      height: 64px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: #ffffff;
      z-index: 10;
      flex-shrink: 0;
    }

    .menu-toggle-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.4rem;
      color: #0f172a;
      cursor: pointer;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #0f172a;
    }

    .creator-tag {
      font-size: 0.75rem;
      background: #dbeafe;
      color: #2563eb;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20% 120px 20%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      scroll-behavior: smooth;
      width: 100%;
    }

    .welcome-hero {
      margin-top: 40px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .welcome-hero h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
    }

    .welcome-hero p {
      color: #64748b;
      font-size: 1rem;
      max-width: 500px;
    }

    /* Messages & Formatting */
    .msg-row {
      display: flex;
      gap: 12px;
      animation: fadeIn 0.2s ease-out;
      width: 100%;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .msg-content {
      max-width: 88%;
      line-height: 1.6;
      font-size: 0.95rem;
      word-break: break-word;
      overflow-wrap: anywhere;
      min-width: 0;
    }

    .msg-row.user .msg-content {
      background-color: #f1f5f9;
      padding: 12px 18px;
      border-radius: 18px;
      border-top-right-radius: 4px;
      color: #0f172a;
    }

    .msg-row.bot .msg-content {
      padding-top: 2px;
      color: #0f172a;
      width: 100%;
    }

    .msg-content code {
      background: #f1f5f9;
      color: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.88rem;
    }

    .code-block-wrapper {
      position: relative;
      margin: 12px 0;
      border-radius: 10px;
      overflow: hidden;
      background: #0f172a;
      width: 100%;
      max-width: 100%;
      border: 1px solid #1e293b;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 8px 14px;
      color: #94a3b8;
      font-size: 0.78rem;
      font-family: monospace;
      font-weight: 600;
    }

    .copy-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      background: #1d4ed8;
    }

    .msg-content pre {
      background: #0f172a;
      color: #f8fafc;
      padding: 14px 16px;
      margin: 0;
      font-family: Consolas, Monaco, "Andale Mono", monospace;
      font-size: 0.85rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      max-width: 100%;
    }

    .msg-content pre code {
      background: transparent;
      color: inherit;
      padding: 0;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Floating Input Bar */
    .input-bar-container {
      position: absolute;
      bottom: 20px;
      left: 20%;
      right: 20%;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 28px;
      padding: 8px 8px 8px 20px;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      z-index: 10;
    }

    .input-bar-container input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 0.95rem;
      background: transparent;
      color: #0f172a;
    }

    .send-btn {
      background-color: #2563eb;
      color: white;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .send-btn:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    .typing-dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #64748b;
      border-radius: 50%;
      margin-right: 4px;
      animation: pulse 1.2s infinite ease-in-out both;
    }

    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 15;
    }

    @media (max-width: 768px) {
      body {
        background-color: #000000;
      }

      .app-viewport {
        width: 100vw;
        height: 100vh;
      }

      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        box-shadow: 4px 0 20px rgba(0,0,0,0.1);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .drawer-overlay.active {
        display: block;
      }

      .menu-toggle-btn {
        display: block;
      }

      .chat-container {
        padding: 16px 12px 100px 12px;
      }

      .input-bar-container {
        left: 12px;
        right: 12px;
        bottom: 12px;
      }

      .msg-content {
        max-width: 92%;
      }
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
      <button class="new-chat-btn" onclick="startNewChat(); closeMobileDrawer();">
        <span>+</span> New Project
      </button>
      <div class="history-label">Previous Code Chats</div>
      <div class="chat-history-list" id="historyList"></div>
    </div>

    <div class="main-view">
      <div class="app-header">
        <button class="menu-toggle-btn" onclick="toggleSidebar()">☰</button>
        <div class="brand-title">
          Regerd AI
          <span class="creator-tag">By Aditya Ghatak</span>
        </div>
        <button class="menu-toggle-btn" onclick="startNewChat()" style="font-size: 1.2rem;">✏️</button>
      </div>

      <div class="chat-container" id="chatContainer">
        <div class="welcome-hero" id="welcomeHero">
          <h1>Welcome to Regerd AI</h1>
          <p>Your web development and software engineering assistant created by Aditya Ghatak.</p>
        </div>
      </div>

      <div class="input-bar-container">
        <input type="text" id="userInput" placeholder="Ask Regerd AI to write code, design layout..." onkeypress="handleKeyPress(event)" />
        <button id="sendBtn" class="send-btn" onclick="sendMessage()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <script>
    const OPENROUTER_API_KEY = "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";
    const MODEL_NAME = "openrouter/free"; 

    const SYSTEM_PROMPT = "You are Regerd AI, an AI assistant built by Aditya Ghatak. You are strictly and exclusively for coding, website development, full-stack software development, HTML/CSS/JavaScript, and programming topics. If the user query is NOT strictly related to coding, programming, or web development, reply ONLY with: \"I'm unable to answer this question bcz I'm build for coding\". Do not print metadata or safety ratings.";

    let chats = JSON.parse(localStorage.getItem('regerd_coding_chats')) || [];
    let currentChatId = null;

    window.onload = () => {
      renderHistory();
      if (chats.length > 0) {
        loadChat(chats[0].id);
      }
    };

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('drawerOverlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    function closeMobileDrawer() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('drawerOverlay');
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
    }

    function autoScroll() {
      const container = document.getElementById('chatContainer');
      container.scrollTop = container.scrollHeight;
    }

    function startNewChat() {
      currentChatId = Date.now().toString();
      const newChat = {
        id: currentChatId,
        title: "New Project",
        messages: []
      };
      chats.unshift(newChat);
      saveChatsToStorage();
      renderHistory();
      renderChatMessages();
    }

    function loadChat(id) {
      currentChatId = id;
      renderHistory();
      renderChatMessages();
    }

    function saveChatsToStorage() {
      localStorage.setItem('regerd_coding_chats', JSON.stringify(chats));
    }

    function renderHistory() {
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';

      chats.forEach(chat => {
        const item = document.createElement('div');
        item.classList.add('history-item');
        if (chat.id === currentChatId) item.classList.add('active');
        item.textContent = chat.title || 'New Project';
        item.onclick = () => {
          loadChat(chat.id);
          closeMobileDrawer();
        };
        historyList.appendChild(item);
      });
    }

    function renderChatMessages() {
      const container = document.getElementById('chatContainer');
      container.innerHTML = '';

      const currentChat = chats.find(c => c.id === currentChatId);

      if (!currentChat || currentChat.messages.length === 0) {
        container.innerHTML = `
          <div class="welcome-hero" id="welcomeHero">
            <h1>Welcome to Regerd AI</h1>
            <p>Your web development and software engineering assistant created by Aditya Ghatak.</p>
          </div>`;
        return;
      }

      currentChat.messages.forEach(msg => {
        appendMessageUI(msg.role, msg.content);
      });

      autoScroll();
    }

    function copyCode(button) {
      const wrapper = button.closest('.code-block-wrapper');
      const codeElement = wrapper.querySelector('code');
      const textToCopy = codeElement.innerText;

      navigator.clipboard.writeText(textToCopy).then(() => {
        const originalText = button.textContent;
        button.textContent = "Copied!";
        button.style.background = "#16a34a";
        setTimeout(() => {
          button.textContent = originalText;
          button.style.background = "#2563eb";
        }, 2000);
      }).catch(err => {
        console.error("Copy failed: ", err);
      });
    }

    function parseMarkdown(text) {
      if (!text) return '';

      let cleaned = text.replace(/(User Safety:\s*\w+|Response Safety:\s*\w+)/gi, '').trim();

      const codeBlocks = [];
      cleaned = cleaned.replace(/```([\s\S]*?)```/g, function(match, codeContent) {
        const safeCode = codeContent.trim()
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
        
        const placeholder = `__CODE_BLOCK_${codeBlocks.length}__`;
        codeBlocks.push(`
          <div class="code-block-wrapper">
            <div class="code-header">
              <span>CODE</span>
              <button class="copy-btn" onclick="copyCode(this)">Copy</button>
            </div>
            <pre><code>${safeCode}</code></pre>
          </div>
        `);
        return placeholder;
      });

      let escaped = cleaned
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');
      escaped = escaped.replace(/^### (.*$)/gim, '<h3>$1</h3>');
      escaped = escaped.replace(/^## (.*$)/gim, '<h2>$1</h2>');
      escaped = escaped.replace(/^# (.*$)/gim, '<h1>$1</h1>');
      escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      escaped = escaped.replace(/\*(.*?)\*/g, '<em>$1</em>');
      escaped = escaped.replace(/^\s*[-*]\s+(.*$)/gim, '<ul><li>$1</li></ul>');
      escaped = escaped.replace(/<\/ul>\n<ul>/g, '');
      escaped = escaped.replace(/\n/g, '<br>');

      codeBlocks.forEach((block, index) => {
        escaped = escaped.replace(`__CODE_BLOCK_${index}__`, block);
      });

      return escaped;
    }

    function appendMessageUI(role, rawContent) {
      const container = document.getElementById('chatContainer');

      const hero = document.getElementById('welcomeHero');
      if (hero) hero.remove();

      const row = document.createElement('div');
      row.classList.add('msg-row', role);

      if (role === 'bot') {
        const avatar = document.createElement('div');
        avatar.classList.add('avatar');
        avatar.textContent = 'R';
        row.appendChild(avatar);
      }

      const contentDiv = document.createElement('div');
      contentDiv.classList.add('msg-content');
      contentDiv.innerHTML = parseMarkdown(rawContent);
      row.appendChild(contentDiv);

      container.appendChild(row);
      autoScroll();
      return contentDiv;
    }

    async function sendMessage() {
      const userInput = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const prompt = userInput.value.trim();

      if (!prompt) return;

      if (!currentChatId) {
        currentChatId = Date.now().toString();
        chats.unshift({
          id: currentChatId,
          title: prompt.substring(0, 22) + "...",
          messages: []
        });
      }

      const activeChat = chats.find(c => c.id === currentChatId);
      if (activeChat.messages.length === 0) {
        activeChat.title = prompt.substring(0, 22) + "...";
      }

      activeChat.messages.push({ role: 'user', content: prompt });
      appendMessageUI('user', prompt);

      userInput.value = '';
      sendBtn.disabled = true;

      const botContentDiv = appendMessageUI('bot', '');
      botContentDiv.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;

      saveChatsToStorage();
      renderHistory();

      const apiMessages = [
        { role: "system", content: SYSTEM_PROMPT },
        ...activeChat.messages.map(m => ({
          role: m.role === 'bot' ? 'assistant' : 'user',
          content: m.content
        }))
      ];

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
            "Content-Type": "application/json",
            "HTTP-Referer": window.location.origin,
            "X-Title": "Regerd AI"
          },
          body: JSON.stringify({
            model: MODEL_NAME,
            messages: apiMessages
          })
        });

        const data = await response.json();

        if (response.ok && data.choices && data.choices[0]?.message?.content) {
          const reply = data.choices[0].message.content;
          botContentDiv.innerHTML = parseMarkdown(reply);
          activeChat.messages.push({ role: 'bot', content: reply });
        } else {
          const err = data.error?.message || "Response error.";
          botContentDiv.innerHTML = `<span>Error: ${err}</span>`;
          activeChat.messages.push({ role: 'bot', content: `Error: ${err}` });
        }
      } catch (error) {
        console.error(error);
        botContentDiv.innerHTML = `<span>Network connection error.</span>`;
      } finally {
        sendBtn.disabled = false;
        saveChatsToStorage();
        autoScroll();
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    }
  </script>
</body>
  </html>
