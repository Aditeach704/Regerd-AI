<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Regerd AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-header h2 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .login-header p {
      color: #64748b;
      font-size: 0.9rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #0f172a;
    }

    .form-group input {
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #2563eb;
    }

    .login-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    .login-footer {
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
    }

    .login-footer a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Enter your credentials to access Regerd AI</p>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="developer@example.com" required />
      </div>

      <div class="form-group" style="margin-top: 12px;">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="••••••••" required />
      </div>

      <button type="submit" class="login-btn">Sign In & Continue</button>
    </form>

    <div class="login-footer">
      Don't have an account? <a href="workspace.html">Continue as Guest</a>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      window.location.href = "workspace.html";
    }
  </script>

</body>
</html>
